spring:
  application:
    name: mealkit

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

db-scheduler:
  enabled: true
  threads: 5
  polling-interval: 10s
  heartbeat-interval: 5m
  table-name: scheduled_tasks
  immediate-execution-enabled: false
  scheduler-name: mealkit-scheduler
