# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# PostgreSQL Performance Tuning for Tests
# These settings prioritize speed over durability (safe for tests)
zonky.test.database.postgres.client.properties.options=-c fsync=off -c synchronous_commit=off -c full_page_writes=off -c shared_buffers=256MB -c effective_io_concurrency=200 -c maintenance_io_concurrency=50 -c max_wal_size=2GB -c checkpoint_timeout=30min -c random_page_cost=1.1
