# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Zonky Embedded Database - Use PostgreSQL 18.1 with Docker
zonky.test.database.postgres.docker.image=postgres:18.1-alpine
zonky.test.database.postgres.docker.tmpfs.enabled=true
zonky.test.database.postgres.docker.tmpfs.options=rw,noexec,nosuid

# PostgreSQL Performance Tuning for Tests
# These settings prioritize speed over durability (safe for tests)
# Note: These must be set via docker.postgres.server.properties since they require restart
zonky.test.database.postgres.server.properties.fsync=off
zonky.test.database.postgres.server.properties.synchronous_commit=off
zonky.test.database.postgres.server.properties.full_page_writes=off
zonky.test.database.postgres.server.properties.shared_buffers=256MB
zonky.test.database.postgres.server.properties.effective_io_concurrency=200
zonky.test.database.postgres.server.properties.maintenance_io_concurrency=50
zonky.test.database.postgres.server.properties.max_wal_size=2GB
zonky.test.database.postgres.server.properties.checkpoint_timeout=30min
zonky.test.database.postgres.server.properties.random_page_cost=1.1
